[package]
name = "veritas"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"
publish = false
default-run = "veritas"

[workspace]
members = [".", "crates/veritas-anchor", "crates/veritas-api", "crates/veritas-inflation"]
resolver = "3"

[dependencies]
blake2b_simd = "1.0.4"
blake3 = "1.8.5"
getrandom = "0.3"
secp256k1 = { version = "0.29.0", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
