[package]
name = "veritas-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.24.0", features = ["v4"] }
veritas = { path = "../.." }

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
